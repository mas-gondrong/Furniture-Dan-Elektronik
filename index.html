<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURNITURE & ELEKTRONIK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a237e">
</head>
<body>

    <!-- 1. HEADER UTAMA -->
    <header class="main-header">
        <div class="header-container">
            <!-- Logo Kotak Sebelah Kiri -->
            <div class="logo-area">
                <img src="logo.png" alt="Logo Toko" class="logo-img">
            </div>
            
            <!-- Tombol Garis Tiga Sebelah Kanan -->
            <button class="hamburger-menu" id="menuBtn" aria-label="Buka Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- POPUP MENU OVERLAY (Muncul saat garis tiga diklik) -->
    <div class="menu-overlay" id="menuOverlay">
        <button class="close-btn" id="closeBtn">&times;</button>
        <nav class="overlay-nav">
            <a href="#beranda" class="menu-item">Beranda</a>
            <a href="#galery" class="menu-item">Galery</a>
            <a href="#testimoni" class="menu-item">Testimoni</a>
            <a href="#hubungi" class="menu-item">Hubungi</a>
            <a href="#tentang" class="menu-item">Tentang Kami</a>
        </nav>
    </div>

    <!-- 2. BANNER / SPANDUK TOKO -->
    <section class="banner-section">
        <img src="banner.jpg" alt="Spanduk Toko Furniture & Elektronik" class="banner-img">
    </section>

    <!-- KONTEN KATALOG (OPSIONAL/SISA KONTEN) -->
    <main id="beranda">
        <section class="kategori">
            <h2>Katalog Produk</h2>
            <div class="grid-container">
                <div class="card">
                    <div class="badge">Furniture</div>
                    <h3>Sofa Minimalis</h3>
                    <p>Sofa ruang tamu premium dengan busa empuk dan kain tahan lama.</p>
                </div>
                <div class="card">
                    <div class="badge">Elektronik</div>
                    <h3>Smart TV 4K</h3>
                    <p>Televisi pintar resolusi ultra HD dengan fitur perintah suara.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FURNITURE & ELEKTRONIK. Bisa diakses offline.</p>
    </footer>

    <!-- SCRIPT UNTUK INTERAKSI POPUP MENU & PWA -->
    <script>
        // Logika Interaksi Hambuger Menu
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuItems = document.querySelectorAll('.menu-item');

        // Buka Popup
        menuBtn.addEventListener('click', () => {
            menuOverlay.classList.add('active');
        });

        // Tutup Popup via Tombol Silang
        closeBtn.addEventListener('click', () => {
            menuOverlay.classList.remove('active');
        });

        // Tutup Popup otomatis jika salah satu menu diklik
        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                menuOverlay.classList.remove('active');
            });
        });

        // Registrasi Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Service Worker Aktif!'))
                    .catch(err => console.log('SW Gagal:', err));
            });
        }
    </script>
</body>
</html>
